# Free-tier vision/text model hierarchy for the AI router.
#
# Every entry here MUST be free: this file is the single place that decides
# what the router is allowed to spend, so nothing paid may be added without
# also changing the schema's `free: true` guarantee in src/router/config.ts.
#
# `priority` breaks ties among models that are otherwise eligible for a
# request; lower tries first. Limits are the provider's *published* free-tier
# numbers — verify against the provider's own dashboard/docs periodically,
# since free-tier allowances change without notice. The router itself keeps
# a safety buffer below these numbers (see src/router/quota.ts); do not bake
# the buffer into the numbers here.

models:
  - key: groq/qwen3.8-27b
    provider: groq
    modelId: qwen/qwen3.8-27b
    priority: 1
    capabilities:
      text: true
      vision: true
      maxImages: 3
      maxImageBytes: 20971520 # 20 MB
      tokensPerImage: 2048
      contextWindow: 131072
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
    free: true

  - key: groq/qwen3.6-27b
    provider: groq
    modelId: qwen/qwen3.6-27b
    priority: 2
    capabilities:
      text: true
      vision: true
      # Docs said 5; the live API's own 400 error says 3 ("This model
      # supports up to 3 images") — trust the runtime over the docs here.
      maxImages: 3
      maxImageBytes: 20971520
      tokensPerImage: 2048
      contextWindow: 131072
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
    free: true

  # Text-only Groq models disabled by request — vision models only for now.
