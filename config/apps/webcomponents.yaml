# Exercises the webcomponents technology adapter against a local fixture
# containing every ui5-* control kind the adapter classifies.

name: webcomponents
title: Web Components Form

requiresAuth: false

versions:
  old:
    url: file:///C:/screenshot%20system/fixtures/webcomponents-form.html
  new:
    url: file:///C:/screenshot%20system/fixtures/webcomponents-form.html

safety:
  denyLabels:
    - save
    - submit
    - delete
    - post
    - confirm
    - approve
    - send
    - create
  allowLabels:
    - search
    - execute
    - go
  strict: false

budgets:
  controlTimeoutMs: 8000
  maxControlsPerPage: 60
  maxPages: 10
  maxDepth: 3
  maxRunMs: 300000
  stabilityTimeoutMs: 4000

excludeLabels: []
lexicon: {}
testData: {}
